# Workspace from the start, not a single crate that gets split later.
#
# The thing being ported is 274,689 lines of Python across 801 files with a
# 163-table schema, and its own layering (cli / services / repositories) is
# the main reason a correctness fix in one repository file can change a
# dozen commands at once. Mirroring that split here keeps the same
# property: the SQL lives in one place that the CLI cannot reach around.
[workspace]
members = ["crates/templedb-db", "crates/templedb-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
# The synchronous client, not `tokio-postgres` and not `sqlx`. Async
# would make all fifteen public functions in `templedb-db` `async` for a
# CLI that exits after one query, and `sqlx` wants a live database at
# compile time — a port whose `cargo build` fails when a server is down
# is worse than one with unchecked SQL. See `backend/pg.rs`.
postgres = "0.19"
# Only for restoring the default SIGPIPE disposition, which Rust's
# runtime sets to SIG_IGN before main — see `die_on_sigpipe`. Already
# in the lock file via rusqlite and postgres, so it adds no new
# dependency, only a declared one.
libc = "0.2"
# `file set` addresses content by `sha256(bytes)` because Python does,
# and the hash is the identity of a row in `content_blobs` — so it has
# to be the same function, not merely a hash. Already in the lock file
# via the postgres driver's SCRAM authentication, so this adds a
# declaration rather than a dependency. `statediff`'s digest is
# deliberately *not* this: it is a 128-bit FNV variant chosen to be
# order-independent and cheap over 200k rows, and it answers a
# different question.
#
# Pinned to the line already in `Cargo.lock`. Asking for "0.10" instead
# resolves a *different* version, which drags in `generic-array` through
# an older `digest` and fails to build offline — the lock has 0.11 and
# nothing else.
sha2 = "0.11"
# `file retype`'s answer is a function of `importer.scanner`'s
# `FILE_TYPE_PATTERNS`, which is 179 ordered Python regexes, and of
# `SKIP_FILE_PATTERNS`, which is six more. This is the FIRST dependency
# this port has added that was not already in `Cargo.lock` — every other
# line in this block is a declaration of something the lock already
# carried — and it brings three transitive crates with it
# (`regex-automata`, `regex-syntax`, `aho-corasick`), so the addition is
# argued rather than assumed.
#
# The alternative was a hand-written matcher over the dozen or so shapes
# the table actually uses. It was rejected on verification grounds, not
# effort: compiling the pattern *strings* means `classify.rs`'s table
# diffs against `scanner.py`'s line by line and a transcription error is
# a visible textual difference, where a shape-classified table makes all
# 179 entries judgment calls. See `classify.rs`'s header, which records
# that the first draft of this port got the `README` entry's semantics
# wrong while transcribing its pattern correctly.
#
# Default features. `unicode` is what makes `\d` Unicode-aware, which is
# what Python's `\d` is, so turning it off to save binary size would be
# a silent divergence in `is_ignored_path`.
regex = "1"
